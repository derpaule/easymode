[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "pyproject.toml", "README.md", "LICENSE.txt"]

[project]
name = "easymode-reconstruct-only"
version = "1.0.0"
description = "Reconstruction-only wrapper for easymode - wraps WarpTools and AreTomo3"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Tim Schulte" }
]
keywords = [
    "cryo-electron tomography",
    "cryoET",
    "reconstruction",
    "warp",
    "aretomo",
]

dependencies = [
    "mrcfile",
    "numpy>=1.20,<2",
    "scipy",
    "tifffile",
    "psutil",
    "lxml",
    "tqdm",
]

[project.urls]
repository = "https://github.com/timschu/easymode"

[project.scripts]
easymode_reconstruct_only = "easymode.easymode_reconstruct_only:main"
